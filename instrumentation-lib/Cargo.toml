[package]
name = "demo"
edition = "2024"

[[bin]]
name = "demo"
path = "main.rs"

[dependencies]
actix-web = "4.15.0"
rustls = "0.23.43"
tokio-postgres = "0.7.18"
tokio = { version = "1.53.2", features = ["full"] }
awc = { version = "3.8.2", features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
urlencoding = "2.1.3"

opentelemetry-instrumentation-actix-web = { version = "0.25.0", features = ["awc"] }
opentelemetry = "0.33.1"
opentelemetry-appender-log = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry-resource-detectors = "0.13.0"
opentelemetry-semantic-conventions = "0.33.1"
